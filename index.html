    <script>
      (function() {
        // Immediate cross-origin iframe security trap
        function isCrossOriginError(err) {
          if (!err) return false;
          var msg = (typeof err === 'string') ? err : (err.message || err.toString() || '');
          return msg.indexOf('Blocked a frame with origin') !== -1 ||
                 msg.indexOf('cross-origin frame') !== -1 ||
                 (msg.indexOf('Location') !== -1 && msg.indexOf('origin') !== -1);
        }

        // Global onerror hook
        var prevOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          if (isCrossOriginError(msg) || isCrossOriginError(error)) {
            return true; // suppresses error
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('error', function(e) {
          if (isCrossOriginError(e.error || e.message)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isCrossOriginError(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        // Safe location origin fallback
        try {
          if (!window.location.origin) {
            window.location.origin = window.location.protocol + '//' + window.location.host;
          }
        } catch (e) {}
      })();
    </script>
